name: CMS Check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests requests_ntlm beautifulsoup4 python-dotenv

      - run: python cms_notify.py
        env:
          CMS_PASSWORD: ${{ secrets.CMS_PASSWORD }}
      
      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen.json"
          git push